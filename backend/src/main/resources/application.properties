spring.application.name=recover-ai-backend

# --- In-memory H2 database ---
spring.datasource.url=jdbc:h2:mem:recoverdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Razorpay credentials ---
razorpay.key.id=YOUR_RAZORPAY_KEY_ID
razorpay.key.secret=YOUR_RAZORPAY_KEY_SECRET
razorpay.webhook.secret=YOUR_RAZORPAY_WEBHOOK_SECRET

# --- ReCover-AI diagnostic engine ---
ai.engine.url=http://localhost:8000/api/v1/diagnose-and-plan