<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="rows">
    <tr th:each="a : ${audits}"
        th:onclick="'location.href=\'/transactions/' + ${a.id} + '\''"
        th:classappend="${a.status == 'CONFIRMED_RECOVERED'} ? 'border-l-emerald-400' : (${a.status == 'RECOVERED'} ? 'border-l-emerald-500' : (${a.status == 'PENDING_CONFIRMATION'} ? 'border-l-sky-500' : (${a.status == 'IN_PROGRESS'} ? 'border-l-amber-500' : (${a.status == 'ABORTED'} ? 'border-l-rose-500' : 'border-l-slate-600'))))"
        class="border-l-[3px] border-b border-b-[#1B2230] hover:bg-white/[0.02] transition-colors cursor-pointer">
        <td class="px-4 py-3 font-mono text-[12px] text-slate-400 whitespace-nowrap" th:text="${a.transactionId}"></td>
        <td class="px-4 py-3 whitespace-nowrap">
            <div class="text-sm text-slate-200" th:text="${a.customerName}"></div>
            <div class="font-mono text-[11px] text-slate-500" th:text="${a.customerPhone}"></div>
        </td>
        <td class="px-4 py-3 whitespace-nowrap font-mono text-sm text-slate-100" th:text="'₹' + ${#numbers.formatDecimal(a.amount, 1, 'COMMA', 2, 'POINT')}"></td>
        <td class="px-4 py-3 whitespace-nowrap">
            <span class="inline-flex items-center rounded-md bg-slate-700/40 px-2 py-1 font-mono text-[11px] text-slate-300" th:text="${a.errorCode}"></span>
        </td>
        <td class="px-4 py-3 max-w-[280px]">
            <div class="text-sm font-medium text-amber-300" th:text="${a.actionTaken}"></div>
            <div class="mt-0.5 text-[11px] leading-snug text-slate-500 truncate" th:text="${a.decisionTrace}" th:title="${a.decisionTrace}"></div>
        </td>
        <td class="px-4 py-3 whitespace-nowrap font-mono text-sm text-slate-300" th:text="'₹' + ${#numbers.formatDecimal(a.interventionCost, 1, 'COMMA', 2, 'POINT')}"></td>
        <td class="px-4 py-3 whitespace-nowrap font-mono text-sm text-emerald-300" th:text="'₹' + ${#numbers.formatDecimal(a.recoveredAmount, 1, 'COMMA', 2, 'POINT')}"></td>
        <td class="px-4 py-3 whitespace-nowrap">
            <a th:if="${a.paymentLinkUrl != null and !a.paymentLinkUrl.isEmpty()}"
               th:href="${a.paymentLinkUrl}" target="_blank" rel="noopener"
               th:classappend="${a.isRealPaymentLink == true} ? 'text-sky-400 hover:text-sky-300' : 'text-slate-500'"
               class="font-mono text-[12px] hover:underline">
                rzp.io/i/<span th:text="${#strings.abbreviate(a.transactionId, 8)}"></span>
            </a>
            <span th:unless="${a.paymentLinkUrl != null and !a.paymentLinkUrl.isEmpty()}" class="text-[12px] text-slate-600">—</span>
        </td>
        <td class="px-4 py-3 whitespace-nowrap">
            <span th:if="${a.status == 'PENDING_CONFIRMATION'}" class="inline-flex items-center gap-1.5 rounded-full bg-sky-500/10 px-2.5 py-1 text-[11px] font-semibold text-sky-400 ring-1 ring-inset ring-sky-500/30">
                <span class="h-1.5 w-1.5 rounded-full bg-sky-400 animate-pulse"></span>AWAITING PAYMENT
            </span>
            <span th:if="${a.status == 'CONFIRMED_RECOVERED'}" class="inline-flex items-center gap-1.5 rounded-full bg-emerald-500/10 px-2.5 py-1 text-[11px] font-semibold text-emerald-400 ring-1 ring-inset ring-emerald-500/30">
                <span class="h-1.5 w-1.5 rounded-full bg-emerald-400"></span>✓ CONFIRMED PAID
            </span>
            <span th:if="${a.status == 'RECOVERED'}" class="inline-flex items-center gap-1.5 rounded-full bg-emerald-500/10 px-2.5 py-1 text-[11px] font-semibold text-emerald-400 ring-1 ring-inset ring-emerald-500/30">
                <span class="h-1.5 w-1.5 rounded-full bg-emerald-400"></span>RECOVERED
            </span>
            <span th:if="${a.status == 'ABORTED'}" class="inline-flex items-center gap-1.5 rounded-full bg-rose-500/10 px-2.5 py-1 text-[11px] font-semibold text-rose-400 ring-1 ring-inset ring-rose-500/30">
                <span class="h-1.5 w-1.5 rounded-full bg-rose-400"></span>ABORTED
            </span>
            <span th:if="${a.status != 'PENDING_CONFIRMATION' and a.status != 'CONFIRMED_RECOVERED' and a.status != 'RECOVERED' and a.status != 'ABORTED'}" class="inline-flex items-center gap-1.5 rounded-full bg-slate-500/10 px-2.5 py-1 text-[11px] font-semibold text-slate-400 ring-1 ring-inset ring-slate-500/30">
                <span class="h-1.5 w-1.5 rounded-full bg-slate-400"></span><span th:text="${a.status}"></span>
            </span>
        </td>
    </tr>
    <tr th:if="${audits == null or audits.isEmpty()}">
        <td colspan="9" class="px-4 py-10 text-center text-sm text-slate-600">
            No recovery attempts logged yet. Trigger a batch to populate the ledger.
        </td>
    </tr>
</th:block>
