<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="rows">
    <tr th:if="${#lists.isEmpty(audits)}">
        <td colspan="6" class="p-6 text-center text-xs text-gray-500 font-mono">
            No return events in ledger. Click "Ingest 500 Batch Returns" to stream records.
        </td>
    </tr>

    <tr th:each="audit : ${audits}" class="border-b border-gray-800/60 hover:bg-[#161C26]/60 transition font-mono text-xs">
        <td class="py-3 px-4 text-gray-400" th:text="${audit.transactionId}">ret_sample</td>
        <td class="py-3 px-4 text-white font-medium" th:text="'₹' + ${#numbers.formatDecimal(audit.orderAmount, 1, 2)}">₹0.00</td>

        <!-- Continuous Calibrated Risk Score -->
        <td class="py-3 px-4 font-semibold">
            <span th:class="${audit.riskScore >= 0.5 ? 'text-rose-400' : (audit.riskScore >= 0.25 ? 'text-amber-400' : 'text-emerald-400')}"
                  th:text="${#numbers.formatDecimal(audit.riskScore, 1, 3)}">
                0.000
            </span>
        </td>

        <!-- Decision Badge -->
        <td class="py-3 px-4 font-sans">
            <span th:if="${audit.actionTaken == 'MANUAL_REVIEW'}" class="bg-rose-950/80 border border-rose-800/60 text-rose-300 text-[11px] px-2 py-0.5 rounded">MANUAL_REVIEW</span>
            <span th:if="${audit.actionTaken == 'AUTO_REFUND'}" class="bg-emerald-950/80 border border-emerald-800/60 text-emerald-300 text-[11px] px-2 py-0.5 rounded">AUTO_REFUND</span>
        </td>

        <td class="py-3 px-4 text-gray-400" th:text="'₹' + ${#numbers.formatDecimal(audit.interventionCost, 1, 2)}">₹0.00</td>
        <td class="py-3 px-4 text-gray-400 font-sans text-xs truncate max-w-[320px]" th:text="${audit.decisionTrace}">Trace</td>
    </tr>
</th:block>
