<div xmlns:th="http://www.thymeleaf.org" th:fragment="cards" class="contents">

    <!-- Value at Risk -->
    <div class="rounded-xl border border-edge bg-surface p-5">
        <div class="flex items-center justify-between">
            <span class="text-xs font-medium uppercase tracking-wide text-slate-500">Value at Risk</span>
            <span class="h-1.5 w-1.5 rounded-full bg-rose-400"></span>
        </div>
        <div class="mt-3 font-mono text-2xl font-semibold text-white"
             th:text="'₹' + ${#numbers.formatDecimal(stats?.totalAtRisk ?: 0, 1, 'COMMA', 2, 'POINT')}">
            ₹0.00
        </div>
        <div class="mt-1 text-[11px] text-slate-600">Pending recovery attempts</div>
    </div>

    <!-- Gross Recovered -->
    <div class="rounded-xl border border-edge bg-surface p-5">
        <div class="flex items-center justify-between">
            <span class="text-xs font-medium uppercase tracking-wide text-slate-500">Gross Recovered</span>
            <span class="h-1.5 w-1.5 rounded-full bg-emerald-400"></span>
        </div>
        <div class="mt-3 font-mono text-2xl font-semibold text-white"
             th:text="'₹' + ${#numbers.formatDecimal(stats?.totalRecovered ?: 0, 1, 'COMMA', 2, 'POINT')}">
            ₹0.00
        </div>
        <div class="mt-1 text-[11px] text-slate-600">Successfully re-collected</div>
    </div>

    <!-- Net Recovery Rate -->
    <div class="rounded-xl border border-edge bg-surface p-5">
        <div class="flex items-center justify-between">
            <span class="text-xs font-medium uppercase tracking-wide text-slate-500">Net Recovery Rate</span>
            <span class="h-1.5 w-1.5 rounded-full bg-gold"></span>
        </div>
        <div class="mt-3 font-mono text-2xl font-semibold text-white"
             th:text="${#numbers.formatDecimal(stats?.recoveryRate ?: 0, 1, 2, 'POINT')} + '%'">
            0.00%
        </div>
        <div class="mt-1 text-[11px] text-slate-600">Recovered ÷ total failures</div>
    </div>

    <!-- Intervention Cost -->
    <div class="rounded-xl border border-edge bg-surface p-5">
        <div class="flex items-center justify-between">
            <span class="text-xs font-medium uppercase tracking-wide text-slate-500">Intervention Cost</span>
            <span class="h-1.5 w-1.5 rounded-full bg-sky-400"></span>
        </div>
        <div class="mt-3 font-mono text-2xl font-semibold text-white"
             th:text="'₹' + ${#numbers.formatDecimal(stats?.totalCost ?: 0, 1, 'COMMA', 2, 'POINT')}">
            ₹0.00
        </div>
        <div class="mt-1 text-[11px] text-slate-600">Spent across all outreach rails</div>
    </div>
    <!-- Net ROI -->
    <div class="rounded-xl border border-edge bg-surface p-5">
        <div class="flex items-center justify-between">
            <span class="text-xs font-medium uppercase tracking-wide text-slate-500">Net ROI</span>
            <span class="h-1.5 w-1.5 rounded-full bg-gold"></span>
        </div>
        <div class="mt-3 font-mono text-2xl font-semibold text-white"
             th:text="${#numbers.formatDecimal(stats?.roiMultiple ?: 0, 1, 2, 'POINT')} + 'x'">
            0.00x
        </div>
        <div class="mt-1 text-[11px] text-slate-600">Recovered ÷ cost, net of spend</div>
    </div>

</div>
