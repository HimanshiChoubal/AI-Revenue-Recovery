<div xmlns:th="http://www.thymeleaf.org" th:fragment="cards" class="contents">

    <!-- Evaluated GMV -->
    <div class="bg-[#10151D] border border-gray-800 p-5 rounded-xl">
        <div class="flex items-center justify-between text-gray-400 text-xs uppercase font-medium">
            <span>Evaluated GMV</span>
            <span th:if="${stats?.aiEngineOnline}" class="text-emerald-400 text-[10px] font-mono">● ML Active</span>
            <span th:unless="${stats?.aiEngineOnline}" class="text-amber-400 text-[10px] font-mono">▲ Fallback Active</span>
        </div>
        <div class="text-2xl text-white font-mono font-semibold mt-2"
             th:text="'₹' + ${#numbers.formatDecimal(stats?.totalExposedGMV ?: 0, 1, 'COMMA', 2, 'POINT')}">₹0.00</div>
        <div class="text-xs text-gray-500 mt-1" th:text="${stats?.totalEvents ?: 0} + ' total return events'">0 events</div>
    </div>

    <!-- Abuse Blocked -->
    <div class="bg-[#10151D] border border-gray-800 p-5 rounded-xl">
        <div class="text-gray-400 text-xs uppercase font-medium">Abuse Blocked (Saved)</div>
        <div class="text-2xl text-emerald-400 font-mono font-semibold mt-2"
             th:text="'₹' + ${#numbers.formatDecimal(stats?.totalSavedGMV ?: 0, 1, 'COMMA', 2, 'POINT')}">₹0.00</div>
        <div class="text-xs text-gray-500 mt-1">Intercepted for review</div>
    </div>

    <!-- FP Ops Cost -->
    <div class="bg-[#10151D] border border-gray-800 p-5 rounded-xl">
        <div class="text-gray-400 text-xs uppercase font-medium">False-Positive Ops Cost</div>
        <div class="text-2xl text-rose-400 font-mono font-semibold mt-2"
             th:text="'₹' + ${#numbers.formatDecimal(stats?.totalFalsePositiveCost ?: 0, 1, 'COMMA', 2, 'POINT')}">₹0.00</div>
        <div class="text-xs text-gray-500 mt-1">Calculated at ₹500/review</div>
    </div>

    <!-- Held-Out Precision / Recall -->
    <div class="bg-[#10151D] border border-gray-800 p-5 rounded-xl">
        <div class="text-gray-400 text-xs uppercase font-medium">Held-Out Prec / Recall</div>
        <div class="text-2xl text-blue-400 font-mono font-semibold mt-2"
             th:text="${#numbers.formatDecimal(stats?.testPrecision ?: 0, 1, 1)} + '% / ' + ${#numbers.formatDecimal(stats?.testRecall ?: 0, 1, 1)} + '%'">0.0% / 0.0%</div>
        <div class="text-xs text-gray-500 mt-1" th:text="'Opt Threshold: ' + ${#numbers.formatDecimal(stats?.operatingThreshold ?: 0.5, 1, 2)}">Threshold: 0.50</div>
    </div>

</div>
