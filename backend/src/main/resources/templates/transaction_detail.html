<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" class="h-full">
<head>
    <meta charset="UTF-8" />
    <title>Transaction · ReCover-AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full bg-base font-sans text-slate-200 antialiased">
<div class="mx-auto max-w-2xl px-6 py-8">
    <a href="/" class="text-xs text-slate-500 hover:text-slate-300">&larr; Back to ledger</a>
    <h1 class="mt-2 font-mono text-xl text-white" th:text="${audit.transactionId}">pay_abc123</h1>

    <div class="mt-6 rounded-xl border border-edge bg-surface p-5 space-y-3 text-sm">
        <div class="flex justify-between"><span class="text-slate-500">Customer</span><span th:text="${audit.customerName}"></span></div>
        <div class="flex justify-between"><span class="text-slate-500">Phone</span><span class="font-mono" th:text="${audit.customerPhone}"></span></div>
        <div class="flex justify-between"><span class="text-slate-500">Amount</span><span class="font-mono" th:text="'₹' + ${#numbers.formatDecimal(audit.amount, 1, 'COMMA', 2, 'POINT')}"></span></div>
        <div class="flex justify-between"><span class="text-slate-500">Error Code</span><span class="font-mono" th:text="${audit.errorCode}"></span></div>
        <div class="flex justify-between"><span class="text-slate-500">Action Taken</span><span class="text-amber-300" th:text="${audit.actionTaken}"></span></div>
        <div class="flex justify-between"><span class="text-slate-500">Intervention Cost</span><span class="font-mono" th:text="'₹' + ${#numbers.formatDecimal(audit.interventionCost, 1, 'COMMA', 2, 'POINT')}"></span></div>
        <div class="flex justify-between"><span class="text-slate-500">Recovered Amount</span><span class="font-mono text-emerald-300" th:text="'₹' + ${#numbers.formatDecimal(audit.recoveredAmount, 1, 'COMMA', 2, 'POINT')}"></span></div>
        <div class="flex justify-between"><span class="text-slate-500">Payment Link</span><span class="font-mono text-sky-400" th:text="${audit.paymentLinkUrl ?: '—'}"></span></div>
        <div class="flex justify-between"><span class="text-slate-500">Created</span><span th:text="${audit.createdAt}"></span></div>
    </div>

    <div class="mt-4 rounded-xl border border-edge bg-surface p-5">
        <div class="text-xs uppercase tracking-wide text-slate-500">Decision Trace</div>
        <p class="mt-2 text-sm text-slate-300" th:text="${audit.decisionTrace}"></p>
    </div>

    <div class="mt-4 rounded-xl border border-edge bg-surface p-5">
        <div class="text-xs uppercase tracking-wide text-slate-500">Status Timeline</div>
        <ol class="mt-3 space-y-2 text-sm">
            <li class="flex items-center gap-2"><span class="h-2 w-2 rounded-full bg-amber-400"></span>Action dispatched: <span th:text="${audit.actionTaken}"></span></li>
            <li th:if="${audit.status == 'RECOVERED'}" class="flex items-center gap-2"><span class="h-2 w-2 rounded-full bg-slate-500"></span>Predicted recovered (unconfirmed)</li>
            <li th:if="${audit.status == 'CONFIRMED_RECOVERED'}" class="flex items-center gap-2"><span class="h-2 w-2 rounded-full bg-emerald-400"></span>Confirmed via payment_link.paid webhook</li>
            <li th:if="${audit.status == 'ABORTED'}" class="flex items-center gap-2"><span class="h-2 w-2 rounded-full bg-rose-400"></span>Aborted</li>
        </ol>
    </div>
</div>
</body>
</html>
