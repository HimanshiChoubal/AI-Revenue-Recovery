<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" class="h-full">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Risk Manager · Return Sentinel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>body { background-color: #0A0E14; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }</style>
</head>
<body class="p-8 max-w-7xl mx-auto">
<header class="flex justify-between items-center mb-8 border-b border-gray-800 pb-5">
    <div>
        <div class="flex items-center gap-3">
            <h1 class="text-3xl font-bold text-white tracking-tight">AI Return-Risk Sentinel</h1>
            <span class="text-xs bg-emerald-950 text-emerald-400 border border-emerald-800/80 px-2.5 py-0.5 rounded-full font-mono">Defense-Only Verifier</span>
        </div>
        <p class="text-gray-400 mt-1 text-sm">Calibrated ML Risk Scoring &amp; Cost-Optimal Return Routing</p>
    </div>
    <div class="flex items-center gap-3">
        <button hx-post="/api/v1/dashboard/trigger-batch" hx-swap="none"
                class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold px-4 py-2.5 rounded-lg shadow-sm transition">
            Ingest 500 Batch Returns
        </button>
    </div>
</header>

<!-- METRIC CARDS -->
<section id="metrics-grid" hx-get="/api/v1/dashboard/metrics" hx-trigger="load, every 3s"
         class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8" th:insert="~{fragments/metrics_cards}">
</section>

<!-- LIVE LEDGER -->
<section class="rounded-xl border border-gray-800 bg-[#10151D] p-5 shadow-sm">
    <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold text-white">Live Decision &amp; Audit Ledger</h2>
        <div class="flex items-center gap-2 text-xs text-gray-500">
            <span class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span>
            Polling every 2s
        </div>
    </div>

    <div class="overflow-x-auto">
        <table class="w-full text-left text-sm border-collapse">
            <thead>
            <tr class="bg-[#161C26] text-gray-400 text-xs uppercase tracking-wider border-b border-gray-800">
                <th class="py-3 px-4">Txn ID</th>
                <th class="py-3 px-4">Order Amount</th>
                <th class="py-3 px-4">ML Risk Score</th>
                <th class="py-3 px-4">Decision</th>
                <th class="py-3 px-4">FP Ops Impact</th>
                <th class="py-3 px-4">Decision Trace</th>
            </tr>
            </thead>
            <tbody id="audit-tbody" hx-get="/api/v1/dashboard/audit-rows" hx-trigger="load, every 2s"
                   th:insert="~{fragments/audit_rows}">
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
